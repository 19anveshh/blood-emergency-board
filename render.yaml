services:
  - type: web
    name: blood-emergency-board-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: node deploy/start.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATA_DIR
        value: /tmp/blood-emergency-board-data
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
