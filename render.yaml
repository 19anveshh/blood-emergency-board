services:
  - type: web
    name: blood-emergency-board-api
    runtime: node
    rootDir: backend
    plan: 1c-2g
    buildCommand: npm ci
    startCommand: npm start
    initialDeployHook: npm run seed && npm run seed:admin
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/backend/data
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: blood-emergency-board-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  - type: web
    name: blood-emergency-board-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
